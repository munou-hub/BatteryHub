name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

# リリースへのAPK添付に必要（MkFRE V6.1で不足して失敗した権限）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/debug/app-debug.apk "BatteryHub-v${VER}.apk"
          ls -la "BatteryHub-v${VER}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: batteryhub-apk
          path: BatteryHub-v*.apk

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BatteryHub-v*.apk
